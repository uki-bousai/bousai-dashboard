<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>入浴施設の座標を取得（一時ツール）</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --border:rgba(11,11,11,.12); --accent:#2a78d6; --ok:#1f9d6c; --ng:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root{ --surface-1:#1a1a19; --page:#0d0d0d; --text-primary:#fff;
    --text-secondary:#c3c2b7; --border:rgba(255,255,255,.14); --accent:#3987e5; color-scheme:dark }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--page); color:var(--text-primary); line-height:1.7; padding:20px; max-width:760px; margin:0 auto}
h1{font-size:1.1rem; margin-bottom:6px}
p.lead{font-size:.82rem; color:var(--text-secondary); margin-bottom:14px}
button{font:inherit; font-size:.9rem; font-weight:700; color:#fff; background:var(--accent);
  border:0; border-radius:10px; padding:12px 20px; cursor:pointer}
button.sub{background:var(--surface-1); color:var(--accent); border:1.5px solid var(--accent)}
button:disabled{opacity:.5}
#status{font-size:.84rem; font-weight:700; margin:14px 0 8px}
.item{font-size:.78rem; padding:6px 0; border-bottom:1px solid var(--border); display:flex; gap:8px}
.item .st{flex:none; width:1.4em}
.item .nm{flex:1}
.item .co{color:var(--text-muted); font-size:.72rem}
.ok{color:var(--ok)} .ng{color:var(--ng)}
textarea{width:100%; height:220px; font-family:ui-monospace,monospace; font-size:.72rem;
  border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--surface-1);
  color:var(--text-primary); margin-top:10px}
</style>
</head>
<body>
<h1>入浴施設の座標を取得</h1>
<p class="lead">地図に載せるための緯度・経度を、この端末から検索します。1〜2分かかります。終わったら下の結果をコピーして送ってください。<br>※このページは一時的な作業用です。データは書き換わりません。</p>

<button id="run" type="button">検索を始める</button>
<button id="copy" class="sub" type="button" style="display:none">結果をコピー</button>

<div id="status"></div>
<div id="list"></div>
<textarea id="out" readonly placeholder="ここに結果が出ます"></textarea>

<script>
"use strict";
const BOX = { minLat: 31.9, maxLat: 33.4, minLng: 129.8, maxLng: 131.5 };
const inArea = c => c.lat >= BOX.minLat && c.lat <= BOX.maxLat && c.lng >= BOX.minLng && c.lng <= BOX.maxLng;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function gsi(q){
  try{
    const res = await fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q));
    if (!res.ok) return null;
    const j = await res.json();
    if (!Array.isArray(j) || !j.length) return null;
    const c = { lat: j[0].geometry.coordinates[1], lng: j[0].geometry.coordinates[0] };
    return inArea(c) ? c : null;
  } catch (e){ return null; }
}
async function osm(q){
  try{
    const vb = `${BOX.minLng},${BOX.maxLat},${BOX.maxLng},${BOX.minLat}`;
    const res = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&countrycodes=jp" +
      `&viewbox=${vb}&bounded=1&q=` + encodeURIComponent(q));
    if (!res.ok) return null;
    const j = await res.json();
    if (!Array.isArray(j) || !j.length) return null;
    const c = { lat: parseFloat(j[0].lat), lng: parseFloat(j[0].lon) };
    return inArea(c) ? c : null;
  } catch (e){ return null; }
}

document.getElementById("run").addEventListener("click", async () => {
  const runBtn = document.getElementById("run");
  const listEl = document.getElementById("list");
  const statusEl = document.getElementById("status");
  const outEl = document.getElementById("out");
  runBtn.disabled = true;
  listEl.textContent = ""; outEl.value = "";
  statusEl.textContent = "データを読み込み中…";

  let baths;
  try {
    const res = await fetch("seikatsu.json?_=" + Date.now(), { cache: "no-store" });
    baths = (await res.json()).baths || [];
  } catch (e){
    statusEl.textContent = "データの読み込みに失敗しました。通信状況を確認してください。";
    runBtn.disabled = false; return;
  }

  const result = {};
  for (let i = 0; i < baths.length; i++){
    const b = baths[i];
    statusEl.textContent = `検索中… ${i + 1} / ${baths.length}`;
    // ①住所 → ②施設名+市区 → ③施設名（OSM）の順に試す
    let c = b.address ? await gsi(b.address) : null;
    if (!c){ await sleep(300); c = await gsi(`${b.name} ${b.area || ""}`.trim()); }
    if (!c){ await sleep(1100); c = await osm(`${b.name} ${b.address || ""}`.trim()); }

    const row = document.createElement("div"); row.className = "item";
    const st = document.createElement("span"); st.className = "st " + (c ? "ok" : "ng");
    st.textContent = c ? "✓" : "✕";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = b.name;
    const co = document.createElement("span"); co.className = "co";
    co.textContent = c ? `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}` : "見つからず";
    row.append(st, nm, co);
    listEl.appendChild(row);

    if (c) result[b.name] = [Number(c.lat.toFixed(5)), Number(c.lng.toFixed(5))];
    await sleep(400);
  }

  const found = Object.keys(result).length;
  statusEl.textContent = `完了: ${found} / ${baths.length} 件の座標が取れました`;
  outEl.value = JSON.stringify(result, null, 1);
  document.getElementById("copy").style.display = "";
  runBtn.disabled = false;
});

document.getElementById("copy").addEventListener("click", async () => {
  const out = document.getElementById("out");
  out.select(); out.setSelectionRange(0, out.value.length);
  try { await navigator.clipboard.writeText(out.value); document.getElementById("status").textContent = "コピーしました。この内容を送ってください。"; }
  catch (e){ document.execCommand("copy"); }
});
</script>
</body>
</html>
